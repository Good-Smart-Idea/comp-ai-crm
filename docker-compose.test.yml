name: crm-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - crm-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_test"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  crm-test-postgres:
