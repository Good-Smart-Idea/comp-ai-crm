name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: check-types, lint, test
    runs-on: [self-hosted, Linux, X64, gsi-ada]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      ALLOWED_SIGN_IN: example.com
      BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
      API_URL: http://localhost:3001
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-only-google-client-id
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret

    steps:
      - uses: actions/checkout@v5

      - name: Ensure unzip is available (self-hosted runner has no root)
        run: |
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          echo "unzip missing on this self-hosted runner; installing a local copy without root"
          workdir="$(mktemp -d)"
          cd "$workdir"
          apt-get download unzip
          dpkg-deb -x ./unzip_*.deb extracted
          mkdir -p "$HOME/.local/bin"
          cp extracted/usr/bin/unzip "$HOME/.local/bin/unzip"
          chmod +x "$HOME/.local/bin/unzip"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set database URLs from assigned postgres port
        run: |
          PORT="${{ job.services.postgres.ports['5432'] }}"
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:${PORT}/crm_test?schema=public" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:${PORT}/crm_test?schema=public" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:deploy

      - run: bun run check-types

      - run: bun run lint

      - run: bun run lint:slop

      - run: bun run test
